# Console Leboncoin derrière Caddy (mot de passe HTTP Basic).
# Caddy est le seul point d'entrée : rien n'atteint le serveur sans le mot de
# passe. Accès web public au choix — `tailscale funnel 8080` (URL .ts.net
# stable, TLS Let's Encrypt) ou le profil `public` ci-dessous (cloudflared).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lbc-console:latest
    container_name: lbc-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LBC_MODE: ${LBC_MODE:-live}
      DATA_DIR: /app/data
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.7-flash-high}
    volumes:
      - lbc-data:/app/data
    expose:
      - "8787"

  proxy:
    image: caddy:2-alpine
    container_name: lbc-proxy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      LBC_USER: ${LBC_USER:?definir LBC_USER dans deploy/.env}
      LBC_HASH: ${LBC_HASH:?definir LBC_HASH dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Tailnet + LAN : accessible depuis n'importe quelle machine du reseau,
      # toujours derriere le mot de passe Caddy.
      - "8080:8080"

  # Tunnel public ephemere (URL *.trycloudflare.com imprimee dans les logs).
  # `docker compose --profile public up -d`. A remplacer par Tailscale Funnel
  # une fois celui-ci active sur le tailnet : URL stable en .ts.net.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lbc-tunnel
    restart: unless-stopped
    depends_on:
      - proxy
    command: tunnel --no-autoupdate --url http://proxy:8080
    profiles: ["public"]

volumes:
  lbc-data:
  caddy-data:
  caddy-config:
