services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lbc-console:latest
    container_name: lbc-app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      LBC_MODE: ${LBC_MODE:-live}
      DATA_DIR: /app/data
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.7-flash-high}
    volumes:
      # Un dossier hote reste lisible et sauvegardable quel que soit le daemon Docker.
      - ${LBC_DATA_DIR:-../data}:/app/data
    expose:
      - "8787"
    mem_limit: 2g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/v1/status').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2-alpine
    container_name: lbc-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Sans mot de passe, donc publie uniquement sur l'interface choisie.
      # En production LBC_BIND_IP est l'adresse Tailscale de la machine.
      - "${LBC_BIND_IP:-127.0.0.1}:${LBC_PORT:-8899}:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"
